<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>TicketHub - Meus Ingressos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <div class="d-flex align-items-center">
                <img src="https://img.icons8.com/?size=40&id=2xIX3PtQG26u&format=png&color=6f42c1" alt="Logo" class="me-2">
                <a class="navbar-brand fw-bold" th:href="@{/}" style="color:#05000f;">TicketHub</a>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Ver Eventos</a>
                <a th:href="@{/logout}" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width:1000px;">
        <h2 class="fw-bold mb-4">Meus Ingressos</h2>

        <!-- Sem ingressos -->
        <div class="alert alert-info"
             th:if="${#lists.isEmpty(pedidos)}">
            Você ainda não comprou nenhum ingresso.
        </div>

        <!-- Lista de pedidos -->
        <div th:each="pedido : ${pedidos}">
            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
                <div class="row g-0">

                    <!-- Informações -->
                    <div class="col-md-9">
                        <div class="card-body">
                            <span class="badge bg-success mb-3">Ingresso Ativo</span>
                            <h4 class="fw-bold" th:text="${pedido.evento.titulo}"></h4>
                            <hr>
                            <p><strong>Data:</strong>
                                <span th:text="${#temporals.format(pedido.evento.data, 'dd/MM/yyyy HH:mm')}"></span>
                            </p>
                            <p><strong>Local:</strong> <span th:text="${pedido.evento.local}"></span></p>
                            <p><strong>Quantidade:</strong> <span th:text="${pedido.quantidade}"></span> ingresso(s)</p>
                            <p><strong>Forma de pagamento:</strong> <span th:text="${pedido.formaPagamento}"></span></p>
                            <p><strong>Comprador:</strong> <span th:text="${pedido.nomeComprador}"></span></p>
                            <p class="mb-0"><strong>Pedido:</strong> #<span th:text="${pedido.id}"></span></p>
                        </div>
                    </div>

                    <!-- QR Code -->
                    <div class="col-md-3 border-start bg-light">
                        <div class="h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <img th:src="@{/images/frame.png}" alt="QR Code" width="140" height="140" class="border rounded bg-white p-2">
                            <small class="text-muted text-center mt-2">Apresente este QR Code na entrada</small>
                            <button class="btn btn-roxo mt-3 w-100 btn-download"
                                    th:data-titulo="${pedido.evento.titulo}"
                                    th:data-data="${#temporals.format(pedido.evento.data, 'dd/MM/yyyy HH:mm')}"
                                    th:data-local="${pedido.evento.local}"
                                    th:data-codigo="${pedido.id}">
                                Baixar Ingresso
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        document.addEventListener("click", function (e) {
            const btn = e.target.closest(".btn-download");
            if (!btn) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(20);
            doc.setTextColor(111, 66, 193);
            doc.text("TicketHub - Ingresso Oficial", 20, 20);

            doc.setFontSize(14);
            doc.setTextColor(0, 0, 0);
            doc.text(`Evento: ${btn.dataset.titulo}`, 20, 40);
            doc.text(`Data: ${btn.dataset.data}`, 20, 50);
            doc.text(`Local: ${btn.dataset.local}`, 20, 60);
            doc.text(`Pedido: #${btn.dataset.codigo}`, 20, 70);

            const img = new Image();
            img.src = "/images/frame.png";
            img.onload = function () {
                doc.addImage(img, "PNG", 140, 40, 50, 50);
                doc.save(`Ingresso-${btn.dataset.codigo}.pdf`);
            };
        });
    </script>

</body>
</html>
